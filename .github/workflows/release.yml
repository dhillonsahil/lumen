name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os-name: 'windows'
            args: ''
          - platform: 'ubuntu-22.04'
            os-name: 'linux'
            args: '--bundles deb,rpm,appimage'
          - platform: 'macos-latest'
            os-name: 'macos'
            args: '--bundles dmg,app'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Install macOS system dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install mpv

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Setup Windows libmpv binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Copy libmpv-2.dll to target directories if exists in repo or download
          if (Test-Path "target\debug\libmpv-2.dll") {
            New-Item -ItemType Directory -Force -Path "target\release"
            Copy-Item -Force "target\debug\libmpv-2.dll" "target\release\libmpv-2.dll"
            Copy-Item -Force "target\debug\libmpv-2.dll" "src-tauri\libmpv-2.dll"
          } else {
            Write-Host "Downloading libmpv for Windows build..."
            Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-20240407-git-8fbc3c3.7z" -OutFile "mpv-dev.7z"
            7z x mpv-dev.7z -o"mpv-dev"
            New-Item -ItemType Directory -Force -Path "target\release"
            Copy-Item -Force "mpv-dev\libmpv-2.dll" "target\release\libmpv-2.dll"
            Copy-Item -Force "mpv-dev\libmpv-2.dll" "src-tauri\libmpv-2.dll"
          }

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lumen Media Player ${{ github.ref_name }}'
          releaseBody: |
            ## Lumen Media Player Release ${{ github.ref_name }}

            ### Highlights
            - **Native libmpv Engine**: Full hardware-accelerated video decoding (Direct3D11, VAAPI, VideoToolbox).
            - **No Media Home State**: Dark responsive home state with quick file open, URL streams, and recent history.
            - **Comprehensive Formats**: Support for MKV, MP4, AVI, MOV, WEBM, FLV, TS, HLS (.m3u8), DASH (.mpd), and IPTV (.m3u).
            - **Unified Controls**: Integrated Video & Color tuning, 10-band Equalizer, and Diagnostics in Settings.
            - **Keyboard Shortcuts**: Aspect ratio cycling (<kbd>A</kbd>), audio/subtitle track selectors, A/B looping, and screenshot capture.
            - **Default Player Support**: Windows Default Apps and file association integration.

            ### Downloads by Platform:
            - **Windows**: `.msi` (Installer), `.exe` (NSIS Setup), and `.zip` (Portable standalone)
            - **Linux**: `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL), `.AppImage` (Universal Linux)
            - **macOS**: `.dmg` (Universal Disk Image)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create Windows Portable Package
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $PortableDir = "dist\Lumen-Media-Player-windows-portable"
          New-Item -ItemType Directory -Force -Path $PortableDir
          Copy-Item -Force "src-tauri\target\release\lumen-app.exe" "$PortableDir\Lumen-Media-Player.exe"
          if (Test-Path "target\release\libmpv-2.dll") {
            Copy-Item -Force "target\release\libmpv-2.dll" "$PortableDir\libmpv-2.dll"
          }
          if (Test-Path "src-tauri\icons\icon.ico") {
            Copy-Item -Force "src-tauri\icons\icon.ico" "$PortableDir\icon.ico"
          }
          @"
          Lumen Media Player - Portable Edition
          ======================================
          Direct3D11 / libmpv-powered native desktop media player.
          No installation required. Run Lumen-Media-Player.exe directly.
          "@ | Out-File -FilePath "$PortableDir\README.txt" -Encoding utf8

          Compress-Archive -Path "$PortableDir\*" -DestinationPath "dist\Lumen-Media-Player-windows-portable.zip" -Force

      - name: Upload Windows Portable Artifact to Release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/Lumen-Media-Player-windows-portable.zip
