name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os-name: 'windows'
            args: ''
          - platform: 'ubuntu-22.04'
            os-name: 'linux'
            args: '--bundles deb,rpm,appimage'
          - platform: 'macos-latest'
            os-name: 'macos'
            args: '--bundles dmg,app'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            libfuse2 \
            squashfs-tools \
            patchelf

      - name: Install macOS system dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install mpv

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Setup Windows libmpv binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "Downloading libmpv for Windows build..."
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest"
            $asset = $release.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" -and $_.name -notlike "*v3*" } | Select-Object -First 1
            $downloadUrl = $asset.browser_download_url
          } catch {
            $downloadUrl = "https://github.com/zhongfly/mpv-winbuild/releases/download/2026-10-26-baa3e11d42/mpv-dev-x86_64-20261026-git-baa3e11d42.7z"
          }
          Write-Host "Using download URL: $downloadUrl"
          curl.exe -L $downloadUrl -o mpv-dev.7z
          tar.exe -xf mpv-dev.7z
          New-Item -ItemType Directory -Force -Path "target\release", "src-tauri", "packaging\windows\libmpv"
          Copy-Item -Force "libmpv-2.dll" "target\release\libmpv-2.dll"
          Copy-Item -Force "libmpv-2.dll" "src-tauri\libmpv-2.dll"
          Copy-Item -Force "libmpv-2.dll" "packaging\windows\libmpv\libmpv-2.dll"

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lumen Media Player ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create Windows Portable Package
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $PortableDir = "dist\Lumen-Media-Player-windows-portable"
          New-Item -ItemType Directory -Force -Path $PortableDir
          if (Test-Path "target\release\lumen-app.exe") {
            Copy-Item -Force "target\release\lumen-app.exe" "$PortableDir\Lumen-Media-Player.exe"
          } elseif (Test-Path "src-tauri\target\release\lumen-app.exe") {
            Copy-Item -Force "src-tauri\target\release\lumen-app.exe" "$PortableDir\Lumen-Media-Player.exe"
          }
          if (Test-Path "target\release\libmpv-2.dll") {
            Copy-Item -Force "target\release\libmpv-2.dll" "$PortableDir\libmpv-2.dll"
          } elseif (Test-Path "libmpv-2.dll") {
            Copy-Item -Force "libmpv-2.dll" "$PortableDir\libmpv-2.dll"
          }
          if (Test-Path "src-tauri\icons\icon.ico") {
            Copy-Item -Force "src-tauri\icons\icon.ico" "$PortableDir\icon.ico"
          }
          @"
          Lumen Media Player - Portable Edition
          ======================================
          Direct3D11 / libmpv-powered native desktop media player.
          No installation required. Run Lumen-Media-Player.exe directly.
          "@ | Out-File -FilePath "$PortableDir\README.txt" -Encoding utf8

          Compress-Archive -Path "$PortableDir\*" -DestinationPath "dist\Lumen-Media-Player-windows-portable.zip" -Force

      - name: Upload Windows Portable Artifact to Release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/Lumen-Media-Player-windows-portable.zip
