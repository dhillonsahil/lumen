name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os-name: 'windows'
            args: ''
          - platform: 'ubuntu-22.04'
            os-name: 'linux'
            args: '--bundles deb,rpm,appimage'
          - platform: 'macos-latest'
            os-name: 'macos'
            args: '--bundles dmg,app'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get purge -y needrestart || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o DPkg::Options::="--force-confnew" \
            -o DPkg::Options::="--force-confdef" \
            libmpv-dev \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            libfuse2 \
            patchelf

      - name: Install macOS system dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install mpv

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Setup Windows libmpv binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "Downloading libmpv for Windows build..."
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest"
            $asset = $release.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" -and $_.name -notlike "*v3*" } | Select-Object -First 1
            $downloadUrl = $asset.browser_download_url
          } catch {
            $downloadUrl = "https://github.com/zhongfly/mpv-winbuild/releases/download/2026-10-26-baa3e11d42/mpv-dev-x86_64-20261026-git-baa3e11d42.7z"
          }
          Write-Host "Using download URL: $downloadUrl"
          curl.exe -L $downloadUrl -o mpv-dev.7z
          tar.exe -xf mpv-dev.7z
          New-Item -ItemType Directory -Force -Path "target\release", "src-tauri", "packaging\windows\libmpv"
          Copy-Item -Force "libmpv-2.dll" "target\release\libmpv-2.dll"
          Copy-Item -Force "libmpv-2.dll" "src-tauri\libmpv-2.dll"
          Copy-Item -Force "libmpv-2.dll" "packaging\windows\libmpv\libmpv-2.dll"

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lumen Media Player ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create Windows Portable Package
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $PortableDir = "dist\Lumen-Media-Player-windows-portable"
          New-Item -ItemType Directory -Force -Path $PortableDir
          if (Test-Path "target\release\lumen-app.exe") {
            Copy-Item -Force "target\release\lumen-app.exe" "$PortableDir\Lumen-Media-Player.exe"
          } elseif (Test-Path "src-tauri\target\release\lumen-app.exe") {
            Copy-Item -Force "src-tauri\target\release\lumen-app.exe" "$PortableDir\Lumen-Media-Player.exe"
          }
          if (Test-Path "target\release\libmpv-2.dll") {
            Copy-Item -Force "target\release\libmpv-2.dll" "$PortableDir\libmpv-2.dll"
          } elseif (Test-Path "libmpv-2.dll") {
            Copy-Item -Force "libmpv-2.dll" "$PortableDir\libmpv-2.dll"
          }
          if (Test-Path "src-tauri\icons\icon.ico") {
            Copy-Item -Force "src-tauri\icons\icon.ico" "$PortableDir\icon.ico"
          }
          @"
          Lumen Media Player - Portable Edition
          ======================================
          Direct3D11 / libmpv-powered native desktop media player.
          No installation required. Run Lumen-Media-Player.exe directly.
          "@ | Out-File -FilePath "$PortableDir\README.txt" -Encoding utf8

          Compress-Archive -Path "$PortableDir\*" -DestinationPath "dist\Lumen-Media-Player-windows-portable.zip" -Force

      - name: Upload Windows Portable Artifact to Release
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} "dist/Lumen-Media-Player-windows-portable.zip" --clobber

      - name: Create Linux Portable Package
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p dist/Lumen-Media-Player-linux-portable/lib
          BIN_PATH="target/release/lumen-app"
          [ -f "src-tauri/target/release/lumen-app" ] && BIN_PATH="src-tauri/target/release/lumen-app"
          cp -f "$BIN_PATH" dist/Lumen-Media-Player-linux-portable/lumen-app
          
          # Copy libmpv and dependencies into portable lib/
          cp -d /usr/lib/x86_64-linux-gnu/libmpv.so* dist/Lumen-Media-Player-linux-portable/lib/ 2>/dev/null || true
          
          # Create launcher script
          cat << 'EOF' > dist/Lumen-Media-Player-linux-portable/run.sh
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$DIR:$LD_LIBRARY_PATH"
          export GDK_BACKEND=x11
          exec "$DIR/lumen-app" "$@"
          EOF
          chmod +x dist/Lumen-Media-Player-linux-portable/run.sh dist/Lumen-Media-Player-linux-portable/lumen-app
          
          if [ -f "src-tauri/icons/128x128.png" ]; then
            cp -f "src-tauri/icons/128x128.png" dist/Lumen-Media-Player-linux-portable/icon.png
          fi
          
          cat << 'EOF' > dist/Lumen-Media-Player-linux-portable/README.txt
          Lumen Media Player - Linux Portable Edition
          ============================================
          Native desktop media player powered by libmpv.
          No installation required.
          To launch, execute:
            ./run.sh [optional_file_path]
          EOF
          
          tar -czf dist/Lumen-Media-Player-linux-portable.tar.gz -C dist Lumen-Media-Player-linux-portable

      - name: Upload Linux Portable Artifact to Release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} "dist/Lumen-Media-Player-linux-portable.tar.gz" --clobber
