[package]
name = "lumen-library"
version = "2.0.2"
edition = "2021"
authors = ["Lumen Team"]
description = "Media library, SQLite indexing, metadata, and history for Lumen v2"

[dependencies]
lumen-core = { path = "../lumen-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
walkdir = "2.5"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
