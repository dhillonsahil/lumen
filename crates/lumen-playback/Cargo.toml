[package]
name = "lumen-playback"
version = "2.0.2"
edition = "2021"
authors = ["Lumen Team"]
description = "Playback engine and libmpv backend for Lumen v2"

[dependencies]
lumen-core = { path = "../lumen-core" }
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
raw-window-handle = "0.6"
