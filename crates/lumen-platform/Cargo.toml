[package]
name = "lumen-platform"
version = "2.0.0"
edition = "2021"
authors = ["Lumen Team"]
description = "Platform-specific integration, window helpers, and OS quirks for Lumen v2"

[dependencies]
lumen-core = { path = "../lumen-core" }
dirs = "5.0"
tracing = "0.1"
thiserror = "2.0"
cfg-if = "1.0"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
