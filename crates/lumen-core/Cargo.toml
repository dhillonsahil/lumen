[package]
name = "lumen-core"
version = "2.0.4"
edition = "2021"
authors = ["Lumen Team"]
description = "Core data models, settings, errors, and shared types for Lumen v2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
