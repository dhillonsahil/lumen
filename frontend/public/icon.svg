<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Main Prism Gradient -->
    <linearGradient id="lumenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- Play Accent Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="160" fill="url(#lumenGrad)" opacity="0.25" filter="url(#softGlow)"/>

  <!-- Base Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Inner Ambient Geometric Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  <circle cx="256" cy="256" r="144" fill="none" stroke="url(#lumenGrad)" stroke-width="3" stroke-dasharray="16 12" opacity="0.4"/>

  <!-- Glowing Geometric "L" Play Prism -->
  <g filter="url(#glow)">
    <!-- Main Angular Dynamic Play Prism (combining 'L' vertical stem and Play arrow) -->
    <path d="M 176 132 C 176 120 188 114 198 120 L 372 236 C 384 244 384 268 372 276 L 198 392 C 188 398 176 392 176 380 Z" fill="url(#lumenGrad)"/>

    <!-- Left Angular Precision Wing (giving the distinct 'L' shape) -->
    <path d="M 176 132 L 176 380 L 140 380 C 132 380 126 374 126 366 L 126 146 C 126 138 132 132 140 132 Z" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- Inner Play Mark Highlight -->
  <path d="M 224 192 L 328 256 L 224 320 Z" fill="url(#playGrad)" opacity="0.95"/>

  <!-- Optical Lens Flare / Reflection Sheen -->
  <ellipse cx="220" cy="160" rx="90" ry="24" transform="rotate(-30 220 160)" fill="white" opacity="0.12"/>
</svg>