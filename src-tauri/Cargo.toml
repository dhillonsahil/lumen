[package]
name = "lumen-app"
version = "2.0.2"
description = "Lumen v2 Native Desktop Media Player"
authors = ["Lumen Team"]
edition = "2021"

[lib]
name = "lumen_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
raw-window-handle = "0.6"
thiserror = "2.0"

lumen-core = { path = "../crates/lumen-core" }
lumen-playback = { path = "../crates/lumen-playback" }
lumen-library = { path = "../crates/lumen-library" }
lumen-platform = { path = "../crates/lumen-platform" }
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
winreg = "0.56"
